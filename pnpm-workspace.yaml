allowBuilds:
  esbuild: true
publicHoistPattern:
  - 'h3-rules'
# These were patched in the security audit; exclude them from the default
# 24h release-age gate so pnpm can install them right away.
minimumReleaseAgeExclude:
  - '@tanstack/devtools-ui'
  - '@tanstack/devtools'
  - '@tanstack/react-devtools'
  - dompurify
  - esbuild
  - js-cookie
  - js-yaml
  - launch-editor
  - lodash
  - lodash-es
  - mermaid
  - nanoid
  - picomatch
  - postcss
  - seroval
  - shell-quote
  - uuid
  - vite
  - ws
  - yaml
  - '@babel/core'
# Pin transitive dependencies to patched versions.
overrides:
  dompurify@<3.4.13: ^3.4.13
  esbuild@<0.28.1: ^0.28.1
  js-cookie@<3.0.6: ^3.0.6
  js-yaml@<4.3.1: ^4.3.1
  launch-editor@<2.14.1: ^2.14.1
  lodash@<4.17.24: ^4.17.24
  lodash-es@<4.17.24: ^4.17.24
  mermaid@<11.16.1: ^11.16.1
  nanoid@<3.3.17: ^3.3.17
  picomatch@<4.0.4: ^4.0.4
  postcss@<8.5.23: ^8.5.23
  seroval@<1.5.3: ^1.5.3
  shell-quote@<1.8.5: ^1.8.5
  uuid@<11.1.1: ^11.1.1
  uuid@>=13.0.0 <13.0.1: ^13.0.1
  vite@<7.3.6: ^7.3.6
  ws@<8.21.0: ^8.21.0
  yaml@<1.10.3: ^1.10.3
  '@babel/core@<7.29.1': ^7.29.1
